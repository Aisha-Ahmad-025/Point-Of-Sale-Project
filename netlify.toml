
[build]
  command = "npm ci --prefix backend --omit=dev && npm ci --prefix frontend --include=dev && npm run build --prefix frontend"
  publish = "frontend/dist"

[build.environment]
  # NODE_ENV=production makes npm skip devDependencies (vite, tailwind, etc.).
  # Force their installation without changing NODE_ENV, so the bundle stays a production build.
  NPM_FLAGS = "--include=dev"
  # Backend test-only dependency; skip downloading a MongoDB binary during deploys.
  MONGOMS_DISABLE_POSTINSTALL = "1"

[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
